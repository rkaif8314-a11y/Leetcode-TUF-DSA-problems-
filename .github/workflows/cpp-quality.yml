name: DSA solution checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check C++ solution files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No C++ solution files found.'
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only "$file"
          done
